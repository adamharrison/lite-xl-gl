name: CI
on: { push: { branches: [master] } }
env:
  LPM_PLUGINS: https://raw.githubusercontent.com/adamharrison/lite-xl-maintenance/latest/lpm-plugins/gh.lua
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setup_release.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with: { fetch-depth: 0 }
      - name: Setup Release
        id: setup_release
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          wget https://github.com/lite-xl/lite-xl-plugin-manager/releases/download/latest/lpm.x86_64-linux -O lpm-latest && chmod +x lpm-latest
          echo "version=`./lpm-latest gh version`" >> $GITHUB_OUTPUT
  build_linux:
    needs: [version]
    permissions: write-all
    runs-on: ubuntu-latest
    defaults: { run: { shell: bash } }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with: { fetch-depth: 0, submodules: true }
      - name: Build Linux
        run: |
          docker run -v .:/gl ghcr.io/lite-xl/lite-xl-build-box-manylinux:latest bash -c 'cd /gl && BIN=libgl.x86_64-linux.so CC=gcc ./build.sh -O3 -DLIBGL_VERSION=\"${{ needs.version.outputs.version }}-x86_64-linux\"'
          # From https://github.com/libsdl-org/SDL/blob/main/docs/README-linux.md#build-dependencies
          sudo apt-get update && sudo apt-get install gcc-14-aarch64-linux-gnu libx11-dev libwayland-dev libasound2-dev libpulse-dev \
            libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev
          sudo ./build.sh clean && BIN=libgl.aarch64-linux.so CC=aarch64-linux-gnu-gcc-14 AR=aarch64-linux-gnu-gcc-ar-14 ./build.sh -O3 -DLIBGL_VERSION=\"${{ needs.version.outputs.version }}-aarch64-linux\"
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with: { name: "Linux", path: "*.so" }

  build_windows:
    needs: [version]
    permissions: write-all
    runs-on: ubuntu-latest
    defaults: { run: { shell: bash } }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with: { fetch-depth: 0, submodules: true }
      - name: Build Windows
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          sudo apt-get install mingw-w64 cmake
          ./build.sh clean
          CC=x86_64-w64-mingw32-gcc AR=x86_64-w64-mingw32-gcc-ar WINDRES=x86_64-w64-mingw32-windres CMAKE_DEFAULT_FLAGS="-DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=NEVER -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=NEVER -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_INCLUDE_PATH=/usr/share/mingw-w64/include" BIN=libgl.x86_64-windows.dll ./build.sh -DLIBGL_VERSION='"'$VERSION-x86_64-windows-`git rev-parse --short HEAD`'"'
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with: { name: "Windows", path: "*.dll" }

  build_macos:
    needs: [version]
    runs-on: macos-latest
    env:
      CC: clang
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with: { fetch-depth: 0, submodules: true }
      - name: Build MacOS
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          ./build.sh clean && BIN=libgl.x86_64-darwin.lib CC=clang CFLAGS="-arch x86_64" CMAKE_DEFAULT_FLAGS="-DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=NEVER -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=NEVER" ./build.sh -O3 -DLIBGL_VERSION='"'${{ needs.version.outputs.version }}-x86_64-darwin'"' -framework OpenGL -framework Cocoa -framework IOKit -framework CoreVideo -framework CoreServices -framework Foundation -framework Carbon -framework Metal -framework UniformTypeIdentifiers
          ./build.sh clean && BIN=libgl.aarch64-darwin.lib CC=clang CFLAGS="-arch arm64" CMAKE_DEFAULT_FLAGS="-DCMAKE_OSX_ARCHITECTURES=arm64  -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=NEVER -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=NEVER" ./build.sh -O3 -DLIBGL_VERSION='"'${{ needs.version.outputs.version }}-x86_64-darwin'"' -framework OpenGL -framework Cocoa -framework IOKit -framework CoreVideo -framework CoreServices -framework Foundation -framework Carbon -framework Metal -framework UniformTypeIdentifiers
      - name: Upload Artifacts -framework Foundation
        uses: actions/upload-artifact@v4
        with: { name: "MacOS", path: "*.lib" }
  

  finalize:
    needs: [version, build_macos, build_linux, build_windows]
    runs-on: ubuntu-latest
    environment: Release
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      with: { fetch-depth: 0 }
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with: { path: "." }
    - name: Perform Release
      env:
        GITHUB_TOKEN: "${{ github.token }}"
        LPM_DISCORD_WEBHOOK: "${{ secrets.DISCORD_WEBHOOK }}"
      run: |
        wget https://github.com/lite-xl/lite-xl-plugin-manager/releases/download/latest/lpm.x86_64-linux -O lpm-latest && chmod +x lpm-latest
        git status
        ./lpm-latest gh release Linux/*.so MacOS/*.lib Windows/*.dll


